
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5050"
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - rede-pratica

  redis:
    image: redis:7
    command: redis-server --appendonly yes
    volumes:
      - redis-dados:/data
    networks:
      - rede-pratica
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  rede-pratica:
    driver: bridge

volumes:
  redis-dados:
